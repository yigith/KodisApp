# Alternatif dağıtım yolu. VPS'te asıl kurulum systemd ile yapılıyor
# (bkz. README ve scripts/deploy.sh); bu dosya Docker tercih edilirse kullanılır.
services:
  api:
    image: kodis-api
    container_name: kodis-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # SQLite veritabanı, container yeniden oluşsa da kalıcı olsun diye volume'da.
      ConnectionStrings__ApplicationDbContext: "Data Source=/data/kodis.db"
      DataProtection__KeyRingPath: /data/keys
      Database__MigrateOnStartup: "true"
      JwtSettings__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      Google__ClientId: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-https://kod.is}
    volumes:
      - kodis-data:/data
    ports:
      - "3333:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

volumes:
  kodis-data:
